id: com.supermodel3.Supermodel
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: supermodel
separate-locales: false
finish-args:
  - --device=all
  - --persist=.supermodel
  - --filesystem=home
  - --filesystem=host:ro
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=wayland
  - --allow=bluetooth
modules:
  - shared-modules/glu/glu-9.json

  - name: sdl2_net
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://www.libsdl.org/projects/SDL_net/release/SDL2_net-2.4.0.tar.gz
        sha256: 9cbca2527feb3f1a622d48ba65cc7dee9b1e3f2c55ceafb7d7720bb058aafb30
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.la

  - name: supermodel
    buildsystem: simple
    build-options:
      env:
        CPLUS_INCLUDE_PATH: /app/include:/app/include/SDL2
    build-commands:
      - make -f Makefiles/Makefile.UNIX
      - install -Dm 0755 bin/supermodel ${FLATPAK_DEST}/bin/supermodel
      - install -Dm 0644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm 0644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm 0644 supermodel128x128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - cp -r Assets ${FLATPAK_DEST}/bin/
      - cp -r Config ${FLATPAK_DEST}/bin/
      - cp -r Docs ${FLATPAK_DEST}/bin/
    sources:
      - type: git
        url: https://github.com/trzy/Supermodel.git
        commit: 14815455dc28fca2c8662fb1ed99d447ecf8f364
      - type: file
        path: com.supermodel3.Supermodel.desktop
      - type: file
        path: com.supermodel3.Supermodel.metainfo.xml
      - type: file
        path: supermodel128x128.png
      - type: patch
        path: ldflags.patch
